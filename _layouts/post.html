---
layout: default
---
<script>
MathJax = {
  tex: { displayMath: [['\\[', '\\]']], inlineMath: [['$', '$']] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

<article>
  <h1>{{ page.title }}</h1>
  <p>{{ page.date | date: "%B %d, %Y" }}</p>
  {{ content }}
</article>
<div id="votes" data-key="{{ page.slug | slugify | truncate: 58, '' }}">
  <button data-type="up" title="Like"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 8h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2c0-1.1-.9-2-2-2zm0 4l-3 7H9V9l4.34-4.34L12.23 10H21v2zM1 9h4v12H1z"/></svg><span>0</span></button>
  <button data-type="down" title="Dislike"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm0 12l-4.34 4.34L11.77 14H3v-2l3-7h9v10zm4-12h4v12h-4z"/></svg><span>0</span></button>
</div>
<script>
(function () {
  var API = 'https://abacus.jasoncameron.dev';
  var NS = 'santiagodestefano-blog';
  var box = document.getElementById('votes');
  var key = box.dataset.key;
  var store = 'vote-' + key;
  var voted = null;
  try { voted = localStorage.getItem(store); } catch (e) {}

  box.querySelectorAll('button').forEach(function (btn) {
    var type = btn.dataset.type;
    var span = btn.querySelector('span');
    var url = API + '/%s/' + NS + '/' + key + '-' + type;
    if (voted) btn.disabled = true;
    if (voted === type) btn.classList.add('chosen');

    fetch(url.replace('%s', 'get'))
      .then(function (r) { return r.ok ? r.json() : { value: 0 }; })
      .then(function (d) { span.textContent = d.value; })
      .catch(function () {});

    btn.addEventListener('click', function () {
      box.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      btn.classList.add('chosen');
      try { localStorage.setItem(store, type); } catch (e) {}
      fetch(url.replace('%s', 'hit'))
        .then(function (r) { return r.json(); })
        .then(function (d) { span.textContent = d.value; })
        .catch(function () {});
    });
  });
})();
</script>
<style>
#votes { margin: 2em 0; display: inline-flex; background: #f2f2f2; border-radius: 18px; overflow: hidden; }
#votes button { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 0 16px; height: 36px; border: none; background: none; color: #0f0f0f; cursor: pointer; }
#votes button + button { border-left: 1px solid #ccc; }
#votes button:hover:not(:disabled) { background: #e5e5e5; }
#votes button:disabled { cursor: default; }
#votes svg { fill: currentColor; }
#votes button.chosen { color: #065fd4; }
</style>
